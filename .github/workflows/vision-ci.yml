name: Vision CI

on:
  push:
    branches: [main]
    paths:
      - "vision/**"
      - "scripts/check_architecture.py"
      - "scripts/verify.py"
      - ".github/workflows/vision-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "vision/**"
      - "scripts/check_architecture.py"
      - "scripts/verify.py"
      - ".github/workflows/vision-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vision

jobs:
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check architecture
        if: matrix.python-version == '3.12'
        run: python ../scripts/check_architecture.py

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

  typecheck:
    name: Typecheck (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Type check with mypy
        run: uv run mypy --strict src/cs2_vision_access/

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Verify wheel entry point
        run: uv run --isolated --with dist/*.whl cs2-vision --help
